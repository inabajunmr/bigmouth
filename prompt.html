<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bigmouth</title>
    <link rel="stylesheet" href="popup.css">
    <script src="prompt.js" type="module"></script>
  </head>
  <body class="prompt">
    <main>
      <header><h1>Save password</h1></header>
      <p id="origin"></p>
      <p id="detail" class="hint"></p>
      <form id="confirm" hidden>
        <div id="username-row" hidden>
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="off">
        </div>
        <div class="actions">
          <button type="submit" id="approve">Continue</button>
          <button type="button" id="cancel" class="secondary">Cancel</button>
        </div>
      </form>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
